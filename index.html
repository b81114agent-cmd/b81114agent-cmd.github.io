<h1>rclone-backup</h1>
<p>rclone-backup is a personal, single-user backup setup. It uses the open-source tool <a href="https://rclone.org">rclone</a> on the owner's own server to upload encrypted backup files to the owner's own Google Drive.</p>
<p>It is not offered to the public and has no other users.</p>
